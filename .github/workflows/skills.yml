name: skills

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .agents/skills is the only source; .claude/skills must stay a symlink to it.
      - run: test "$(readlink .claude/skills)" = ../.agents/skills
      - run: python3 .agents/skills/foreman-start/scripts/foreman.py --help > /dev/null
